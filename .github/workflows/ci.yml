name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (PHP 8.2)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: edl_carepa_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, xml, gd, intl
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        working-directory: backend
        run: composer install --no-progress --prefer-dist

      - name: Lint (syntax)
        working-directory: backend
        run: find src -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: PHPStan (level 5)
        working-directory: backend
        run: ./vendor/bin/phpstan analyse src --level=5 --no-progress

      - name: Crear BD de tests
        run: |
          mysql -h 127.0.0.1 -uroot -proot edl_carepa_test < database/full_dump.sql

      - name: Ejecutar tests PHP
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: edl_carepa_test
          DB_USER: root
          DB_PASSWORD: root
          JWT_SECRET: test_secret_ci_minimo_de_32_caracteres_para_jwt
        run: php tests/run_tests.php

  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Tests (Vitest)
        working-directory: frontend
        run: npm run test -- --run --reporter=verbose

  audit:
    name: Composer security audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.2' }
      - name: composer audit
        working-directory: backend
        run: composer audit --no-dev --format=json
